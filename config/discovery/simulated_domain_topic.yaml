# ==============================================================================
# DISCOVERY METHOD: Simulated Individual User Domain Topic Discovery
# ==============================================================================
run_name: discovery_simulated_domain_topic

dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  source_groups: null

entities:
  mode: simulated
  n_simulated_per_group: 10
  random_state: 42

features:
  method: weighted_opinion_vector
  normalize: true

clustering:
  method: domain_topic_clustering
  n_clusters: 5
  random_state: 42

export:
  output_dir: outputs
  run_name: discovery_simulated_domain_topic
  dataset_prefix: goqa_cluster
