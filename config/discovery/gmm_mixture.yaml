# ==============================================================================
# DISCOVERY METHOD: Gaussian Mixture Model (GMM) Soft MoE Memberships
# ==============================================================================
run_name: discovery_gmm_mixture

dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  source_groups: null

entities:
  mode: observed
  n_simulated_per_group: 10
  random_state: 42

features:
  method: weighted_opinion_vector
  normalize: true

clustering:
  method: gmm_mixture
  n_clusters: 5
  random_state: 42

export:
  output_dir: outputs
  run_name: discovery_gmm_mixture
  dataset_prefix: goqa_cluster
