# ==============================================================================
# DISCOVERY METHOD: Domain-Specific Topic Preference Discovery
# ==============================================================================
run_name: discovery_domain_topic_clustering

dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  source_groups: null

entities:
  mode: observed
  n_simulated_per_group: 10
  random_state: 42

features:
  method: weighted_opinion_vector
  normalize: true

clustering:
  method: domain_topic_clustering
  n_clusters: 5
  random_state: 42
  target_domain: social_values

export:
  output_dir: outputs
  run_name: discovery_domain_topic_clustering
  dataset_prefix: goqa_cluster
