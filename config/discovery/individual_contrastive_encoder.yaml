# ==============================================================================
# DISCOVERY METHOD: Individual User Contrastive Preference Encoder
# ==============================================================================
run_name: discovery_individual_contrastive_encoder

dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  source_groups: null

entities:
  mode: individual
  random_state: 42

features:
  method: weighted_opinion_vector
  normalize: true

clustering:
  method: contrastive_encoder
  n_clusters: 5
  random_state: 42
  projection_dim: 10

export:
  output_dir: outputs
  run_name: discovery_individual_contrastive_encoder
  dataset_prefix: goqa_cluster
