# Floor baseline — minimum preference-aware group discovery.
# Clusters entities by mean-opinion-vector similarity (KMeans).
# Advanced methods (cross_predictive, embedding_sets, etc.) should beat this.

dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  source_groups: null

entities:
  mode: observed
  n_simulated_per_group: 10
  random_state: 42

features:
  method: mean_opinion_vector
  normalize: true

clustering:
  method: preference_similarity
  n_clusters: 5
  random_state: 42
  n_init: 10

stability:
  enabled: false
  n_bootstrap: 20
  subsample_frac: 0.8

export:
  output_dir: outputs
  run_name: null
  dataset_prefix: goqa_cluster
