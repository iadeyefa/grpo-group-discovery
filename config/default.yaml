# Default clustering config — groups entities by preference similarity.
dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  # HF population group filter; null = all groups present in dataset.
  source_groups: null

entities:
  # observed  — one entity per source group with preference records
  # simulated — synthetic individuals per source group (for future methods)
  mode: observed
  n_simulated_per_group: 10
  random_state: 42

features:
  method: mean_opinion_vector
  normalize: true

clustering:
  algorithm: kmeans
  n_clusters: 5
  random_state: 42
  n_init: 10

stability:
  enabled: false
  n_bootstrap: 20
  subsample_frac: 0.8

export:
  output_dir: outputs
  run_name: null
  dataset_prefix: goqa_cluster
