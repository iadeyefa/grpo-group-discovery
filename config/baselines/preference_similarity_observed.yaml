# ==============================================================================
# BASELINE 3 (Observed Mode): Preference Similarity (Country Entity Level)
# ==============================================================================
run_name: baseline_preference_similarity_observed

dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  source_groups: null

entities:
  mode: observed
  n_simulated_per_group: 10
  random_state: 42

features:
  method: mean_opinion_vector
  normalize: true

clustering:
  method: preference_similarity
  n_clusters: 5
  random_state: 42
  n_init: 10

stability:
  enabled: false

export:
  output_dir: outputs
  run_name: baseline_preference_similarity_observed
  dataset_prefix: goqa_cluster
