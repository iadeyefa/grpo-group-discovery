# ==============================================================================
# BASELINE 3: Preference Similarity (Floor Baseline - Mean Vectors + KMeans)
# ==============================================================================
# HOW THIS METHOD WORKS:
# 1. For each person or entity, we look at all the survey questions they answered
#    and take their average probability distribution over options.
# 2. This creates a single "preference summary vector" for that person.
# 3. We L2-normalize these vectors so everyone is compared on direction/angle,
#    not on how many questions they answered.
# 4. Finally, we run standard KMeans clustering to group people with similar average
#    choice patterns into K distinct clusters.
#
# WHY WE USE IT:
# - This is our minimum "floor" baseline. It is the simplest possible preference-aware
#   clustering method. Every advanced discovery method (Methods 1-3) is expected to
#   outperform this baseline on preference separation and worst-group GRPO reward.
# ==============================================================================

run_name: baseline_preference_similarity

dataset:
  name: Anthropic/llm_global_opinions
  cache_dir: null
  source_groups: null

entities:
  mode: blind
  n_simulated_per_group: 10
  random_state: 42

features:
  method: mean_opinion_vector
  normalize: true

clustering:
  method: preference_similarity
  n_clusters: 5
  random_state: 42
  n_init: 10

stability:
  enabled: false
  n_bootstrap: 20
  subsample_frac: 0.8

export:
  output_dir: outputs
  run_name: baseline_preference_similarity
  dataset_prefix: goqa_cluster
